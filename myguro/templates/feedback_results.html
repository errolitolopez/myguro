{% extends "base.html" %}

{% block title %}Feedback · MyGuro{% endblock %}

{% block content %}
{% include "_navbar.html" %}

<main id="feedback-results" class="container py-3" style="max-width: 760px;">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h1 class="h4 mb-0">Feedback</h1>
      <div id="feedback-count" class="small text-body-secondary"></div>
    </div>
    <div class="btn-group btn-group-sm" role="group" aria-label="Whose feedback">
      <input type="radio" class="btn-check" name="who" id="who-all" value="" autocomplete="off" checked>
      <label class="btn btn-toggle" for="who-all">Everyone</label>
      <input type="radio" class="btn-check" name="who" id="who-teacher" value="teacher" autocomplete="off">
      <label class="btn btn-toggle" for="who-teacher">Teachers</label>
      <input type="radio" class="btn-check" name="who" id="who-student" value="student" autocomplete="off">
      <label class="btn btn-toggle" for="who-student">Students</label>
    </div>
  </div>

  <div id="feedback-error" class="alert alert-danger d-none" role="alert"></div>
  <div id="feedback-list" class="d-grid gap-3">
    <div class="list-group">{% include "_skeleton.html" %}</div>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/feedback-results.js') }}"></script>
{% endblock %}
