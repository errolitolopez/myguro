{% extends "base.html" %}

{% block title %}My activities · MyGuro{% endblock %}

{% block content %}
{% include "_navbar.html" %}

<main class="container py-3" style="max-width: 760px;">
  <div id="list-error" class="alert alert-danger d-none" role="alert"></div>

  <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
    <h1 class="h4 mb-0">My activities</h1>
    <div class="btn-group btn-group-sm" role="group" aria-label="Show">
      <input type="radio" class="btn-check" name="show" id="show-todo" value="todo" checked>
      <label class="btn btn-toggle" for="show-todo">To do <span id="count-todo"></span></label>
      <input type="radio" class="btn-check" name="show" id="show-done" value="done">
      <label class="btn btn-toggle" for="show-done">Submitted <span id="count-done"></span></label>
    </div>
  </div>

  <div id="activity-list">
    <div class="list-group">
      <div class="list-group-item text-body-secondary">Loading...</div>
    </div>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/my-activities.js') }}"></script>
{% endblock %}
