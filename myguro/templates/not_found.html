{% extends "base.html" %}

{% block title %}Page not found · MyGuro{% endblock %}

{% block content %}
<main class="container d-flex align-items-center justify-content-center flex-grow-1">
  <div class="card shadow-sm w-100 text-center" style="max-width: 380px;">
    <div class="card-body p-4">
      <h1 class="mb-3">{% with height=48 %}{% include "_logo.html" %}{% endwith %}</h1>
      <div class="display-4 fw-semibold">404</div>
      <h2 class="h5">Page not found</h2>
      <p class="text-body-secondary">The page you are looking for does not exist, or the address is wrong.</p>
      <!-- "/" sends a logged-in person to their first page and everyone else to the login page -->
      <a href="/" class="btn btn-success bi bi-house">Go to MyGuro</a>
    </div>
  </div>
</main>
{% endblock %}
