{# Reading settings in the account menu; reading.js fills in the saved choices and saves new ones. #}
<div class="mb-2">
  <label class="form-label small text-body-secondary mb-1" for="text-size-select">Text size</label>
  <select id="text-size-select" class="form-select form-select-sm" data-reading-select="size">
    <option value="small">Small</option>
    <option value="normal">Normal</option>
    <option value="large">Large</option>
    <option value="xlarge">Extra large</option>
  </select>
</div>
<div class="mb-2">
  <label class="form-label small text-body-secondary mb-1" for="text-align-select">Text alignment</label>
  <select id="text-align-select" class="form-select form-select-sm" data-reading-select="align">
    <option value="left">Left</option>
    <option value="justify">Justified</option>
  </select>
</div>
<div>
  <label class="form-label small text-body-secondary mb-1" for="line-spacing-select">Line spacing</label>
  <select id="line-spacing-select" class="form-select form-select-sm" data-reading-select="spacing">
    <option value="normal">Normal</option>
    <option value="relaxed">Relaxed</option>
  </select>
</div>
