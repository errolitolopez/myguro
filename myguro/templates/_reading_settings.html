{# Reading settings in the account menu; reading.js fills in the saved choices and saves new ones. #}
<div class="mb-2">
  <label class="form-label small text-body-secondary mb-1" for="text-size-select">{{ _("Text size") }}</label>
  <select id="text-size-select" class="form-select form-select-sm" data-reading-select="size">
    <option value="small">{{ _("Small") }}</option>
    <option value="normal">{{ _("Normal") }}</option>
    <option value="large">{{ _("Large") }}</option>
    <option value="xlarge">{{ _("Extra large") }}</option>
  </select>
</div>
<div class="mb-2">
  <label class="form-label small text-body-secondary mb-1" for="text-align-select">{{ _("Text alignment") }}</label>
  <select id="text-align-select" class="form-select form-select-sm" data-reading-select="align">
    <option value="left">{{ _("Left") }}</option>
    <option value="justify">{{ _("Justified") }}</option>
  </select>
</div>
<div>
  <label class="form-label small text-body-secondary mb-1" for="line-spacing-select">{{ _("Line spacing") }}</label>
  <select id="line-spacing-select" class="form-select form-select-sm" data-reading-select="spacing">
    <option value="normal">{{ _("Normal") }}</option>
    <option value="relaxed">{{ _("Relaxed") }}</option>
  </select>
</div>
