{# The chatbot's icon: a smiling robot head with a graduation cap. It takes the text colour (currentColor),
   so it is white on the green bubble. Size it with the size="" it is included with. #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="{{ size }}" height="{{ size }}" fill="none"
     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  <!-- graduation cap: the board, the part on the head, and the tassel -->
  <polygon points="24,3 42,10 24,17 6,10" fill="currentColor"/>
  <path d="M14 13.5 V18.5 Q24 23 34 18.5 V13.5"/>
  <path d="M42 10 V17"/>
  <circle cx="42" cy="18.5" r="1.4" fill="currentColor" stroke="none"/>
  <!-- robot head with two eyes and a smile -->
  <rect x="9" y="22" width="30" height="21" rx="6"/>
  <circle cx="18" cy="30" r="2.4" fill="currentColor" stroke="none"/>
  <circle cx="30" cy="30" r="2.4" fill="currentColor" stroke="none"/>
  <path d="M17.5 35.5 Q24 41 30.5 35.5"/>
</svg>
