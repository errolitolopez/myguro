{# The language picker; language.js marks the current language and saves a new choice (a cookie) and reloads.
   The names are the languages' own names, so they are not translated. #}
<label class="form-label small text-body-secondary mb-1" for="language-select">{{ _("Language") }}</label>
<select id="language-select" class="form-select form-select-sm" data-language-select>
  <option value="en">English</option>
  <option value="tl">Taglish</option>
</select>
