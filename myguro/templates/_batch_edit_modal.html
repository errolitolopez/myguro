<!-- Change grade and/or section of the selected students -->
<div class="modal fade" id="batch-modal" tabindex="-1" aria-labelledby="batch-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form id="batch-form" class="modal-content" novalidate>
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="batch-title">Edit grade &amp; section</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="batch-who" class="mb-3"></p>
        <div class="mb-3">
          <label for="batch-grade" class="form-label">Grade</label>
          <select id="batch-grade" class="form-select">
            <option value="*">Keep as is</option>
            {% for grade in GRADES|reverse %}<option>{{ grade }}</option>{% endfor %}
            <option value="">No grade</option>
          </select>
        </div>
        <fieldset>
          <legend class="form-label fs-6">Section</legend>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="batch-section-mode" id="batch-section-keep" value="keep" checked>
            <label class="form-check-label" for="batch-section-keep">Keep as is</label>
          </div>
          <div class="form-check d-flex align-items-center gap-2">
            <input class="form-check-input" type="radio" name="batch-section-mode" id="batch-section-set" value="set">
            <label class="form-check-label text-nowrap" for="batch-section-set">Set to</label>
            <input id="batch-section" class="form-control form-control-sm" maxlength="50" autocomplete="off"
                   placeholder="Abundance" aria-label="New section">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="batch-section-mode" id="batch-section-clear" value="clear">
            <label class="form-check-label" for="batch-section-clear">No section (irregular)</label>
          </div>
        </fieldset>
        <div id="batch-error" class="alert alert-danger py-2 mt-3 mb-0 d-none" role="alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button id="batch-save" type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
