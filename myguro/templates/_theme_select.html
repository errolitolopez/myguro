{# The theme picker; theme.js fills in the saved choice and saves a new one. #}
<label class="form-label small text-body-secondary mb-1" for="theme-select">Theme</label>
<select id="theme-select" class="form-select form-select-sm" data-theme-select>
  <option value="auto">Auto</option>
  <option value="light">Light</option>
  <option value="dark">Dark</option>
  <option value="darcula">Darcula</option>
  <option value="solarized">Solarized</option>
</select>
